<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password | Analytix Club</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/auth.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Navigation -->
  <header class="navbar">
    <div class="container nav-container">
      <a href="index.html" class="brand">
        <div class="brand-badge">A</div>
        <span>Analytix Club</span>
      </a>
      <div class="nav-actions">
        <a href="login.html" class="btn btn-secondary btn-sm">← Back to Login</a>
      </div>
    </div>
  </header>

  <main class="apple-auth-wrapper">
    <div class="apple-auth-card">
      <div class="apple-logo-badge">🔑</div>
      <h1 class="apple-auth-title">Forgot Password?</h1>
      <p class="apple-auth-subtitle">Enter your registered email address and we'll send you a secure recovery link.</p>

      <div id="forgot-alert" class="alert alert-error" style="display: none; margin-bottom: 20px;"></div>
      <div id="forgot-success" class="alert alert-success" style="display: none; margin-bottom: 20px;"></div>

      <form id="forgot-form">
        <div class="apple-input-container">
          <div class="apple-field-row">
            <input type="email" id="email" class="apple-input" placeholder="name@college.edu" required autocomplete="email">
            <span class="apple-field-icon">✉️</span>
          </div>
        </div>

        <button type="submit" id="btn-forgot" class="apple-btn-submit">
          <span>Send Reset Link</span>
          <span style="font-size: 1.1rem; line-height: 1;">→</span>
        </button>
      </form>

      <div class="apple-footer-link">
        Remember your password? <a href="login.html">Sign in here</a>
      </div>
    </div>
  </main>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const form = document.getElementById('forgot-form');
      const emailInput = document.getElementById('email');
      const submitBtn = document.getElementById('btn-forgot');
      const alertBox = document.getElementById('forgot-alert');
      const successBox = document.getElementById('forgot-success');

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        alertBox.style.display = 'none';
        successBox.style.display = 'none';

        const email = emailInput.value.trim();
        if (!email) {
          alertBox.textContent = 'Please enter your email address.';
          alertBox.style.display = 'flex';
          return;
        }

        submitBtn.disabled = true;
        submitBtn.querySelector('span:first-child').textContent = 'Sending reset link...';

        try {
          const res = await Auth.forgotPassword(email);
          successBox.textContent = res.message || 'Password reset link has been sent. Please check your email inbox.';
          successBox.style.display = 'flex';
          form.style.display = 'none';
        } catch (err) {
          alertBox.textContent = err.message || 'Unable to process password reset. Please try again.';
          alertBox.style.display = 'flex';
          submitBtn.disabled = false;
          submitBtn.querySelector('span:first-child').textContent = 'Send Reset Link';
        }
      });
    });
  </script>
</body>
</html>
