<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password | Analytix Club</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/auth.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Navigation -->
  <header class="navbar">
    <div class="container nav-container">
      <a href="index.html" class="brand">
        <div class="brand-badge">A</div>
        <span>Analytix Club</span>
      </a>
      <div class="nav-actions">
        <a href="login.html" class="btn btn-secondary btn-sm">← Back to Login</a>
      </div>
    </div>
  </header>

  <main class="apple-auth-wrapper">
    <div class="apple-auth-card">
      <div class="apple-logo-badge">🔒</div>
      <h1 class="apple-auth-title">Set New Password</h1>
      <p class="apple-auth-subtitle">Choose a secure new password for your Analytix Club account</p>

      <div id="reset-alert" class="alert alert-error" style="display: none; margin-bottom: 20px;"></div>
      <div id="reset-success" class="alert alert-success" style="display: none; margin-bottom: 20px;"></div>

      <form id="reset-form">
        <div class="apple-input-container">
          <div class="apple-field-row">
            <input type="password" id="new_password" class="apple-input" placeholder="New Password (min. 6 characters)" minlength="6" required autocomplete="new-password">
            <button type="button" class="apple-pwd-toggle" onclick="togglePasswordVisibility('new_password', this)" title="Show/Hide password">👁️</button>
          </div>
          <div class="apple-field-row">
            <input type="password" id="confirm_password" class="apple-input" placeholder="Confirm New Password" minlength="6" required autocomplete="new-password">
            <button type="button" class="apple-pwd-toggle" onclick="togglePasswordVisibility('confirm_password', this)" title="Show/Hide password">👁️</button>
          </div>
        </div>

        <button type="submit" id="btn-reset" class="apple-btn-submit">
          <span>Update Password</span>
          <span style="font-size: 1.1rem; line-height: 1;">→</span>
        </button>
      </form>

      <div class="apple-footer-link" style="margin-top: 24px;">
        Return to <a href="login.html">Sign in</a>
      </div>
    </div>
  </main>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/password-reset.js"></script>
  <script>
    function togglePasswordVisibility(fieldId, btn) {
      const input = document.getElementById(fieldId);
      if (!input) return;
      if (input.type === 'password') {
        input.type = 'text';
        btn.textContent = '🙈';
      } else {
        input.type = 'password';
        btn.textContent = '👁️';
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      PasswordReset.init();
    });
  </script>
</body>
</html>
